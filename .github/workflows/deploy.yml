name: Deploy to Vercel

# Deploys the app to the existing `str-motives` Vercel project and makes sure a
# durable, shared data store is configured so motives never disappear.
# - Triggered automatically on push (uses the VERCEL_TOKEN repo secret).
# - Can also be run on demand with a token passed in as an input.
on:
  push:
    branches: ["claude/str-motives-app-yj10rb"]
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel token (used once, not stored)"
        required: false

env:
  VERCEL_ORG_ID: team_RuTb0xbYPkhwEL3QengvoEjF
  VERCEL_PROJECT_ID: prj_6BtwNw1avdqQG1QhYViSMmk3ZrVy
  API: https://api.vercel.com
  SITE: https://str-motives.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure durable store, deploy, verify
        env:
          INPUT_TOKEN: ${{ github.event.inputs.vercel_token }}
          SECRET_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          TOKEN="${INPUT_TOKEN:-$SECRET_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Vercel token available. Add a VERCEL_TOKEN repo secret to deploy. Skipping."
            exit 0
          fi
          echo "::add-mask::$TOKEN"

          AUTH="Authorization: Bearer $TOKEN"
          Q="teamId=$VERCEL_ORG_ID"

          # 1) Make sure a persistent JSON store URL is set on the project, as a
          #    clean ABSOLUTE url (jsonblob returns a relative Location header).
          ENVJSON=$(curl -s "$API/v9/projects/$VERCEL_PROJECT_ID/env?$Q&decrypt=true" -H "$AUTH")
          RAW=$(echo "$ENVJSON" | jq -r '.envs[]? | select(.key=="STATE_BLOB_URL") | .value' | head -n1)

          if [ -z "$RAW" ] || [ "$RAW" = "null" ]; then
            echo "Provisioning a persistent store..."
            RAW=$(curl -s -D - -o /dev/null -X POST https://jsonblob.com/api/jsonBlob \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              -d '{"motives":[],"ideas":[],"friends":[]}' \
              | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2}')
          fi

          # Reduce to the blob id (last path segment) and rebuild a canonical URL.
          BLOB_ID=$(printf '%s' "$RAW" | tr -d ' \r\n' | sed 's#.*/##')
          if [ -z "$BLOB_ID" ]; then echo "Failed to resolve store id"; exit 1; fi
          LOC="https://jsonblob.com/api/jsonBlob/$BLOB_ID"
          echo "::add-mask::$LOC"
          echo "::add-mask::$BLOB_ID"

          # Upsert the env var so it always holds the correct absolute URL.
          curl -s -X POST "$API/v10/projects/$VERCEL_PROJECT_ID/env?$Q&upsert=true" -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"STATE_BLOB_URL\",\"value\":\"$LOC\",\"type\":\"plain\",\"target\":[\"production\",\"preview\",\"development\"]}" \
            -o /dev/null -w "set STATE_BLOB_URL -> http %{http_code}\n"
          echo "Persistent store ready."

          # 2) Deploy (the deployment now inherits STATE_BLOB_URL).
          npm i -g vercel@latest
          vercel deploy --prod --yes --token="$TOKEN"

          # 3) Verify durability.
          echo "Verifying persistence..."
          sleep 20
          echo "  health: $(curl -s "$SITE/api/health")"
          HC='{"type":"createMotive","motive":{"id":"__healthcheck__","title":"hc","category":"","location":"","date":"2026-01-01","startTime":"00:00","createdBy":"hc","createdAt":"2026-01-01T00:00:00Z","bringItems":[],"rsvps":{},"votes":{},"suggestions":[]}}'
          curl -s -X POST "$SITE/api/mutate" -H 'content-type: application/json' -d "$HC" -o /dev/null -w "  write http %{http_code}\n"
          sleep 3
          if curl -s "$LOC" -H "Accept: application/json" | grep -q "__healthcheck__"; then
            echo "  PERSISTENCE OK — data is written to the durable store."
          else
            echo "  WARNING: healthcheck not found in persistent store."
          fi
          # cleanup
          curl -s -X POST "$SITE/api/mutate" -H 'content-type: application/json' \
            -d '{"type":"deleteMotive","id":"__healthcheck__"}' -o /dev/null -w "  cleanup http %{http_code}\n"
