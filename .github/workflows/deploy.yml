name: Deploy to Vercel

# Deploys the app to the existing `str-motives` Vercel project and makes sure a
# durable, shared data store is configured so motives never disappear.
# - Triggered automatically on push (uses the VERCEL_TOKEN repo secret).
# - Can also be run on demand with a token passed in as an input.
on:
  push:
    branches: ["claude/str-motives-app-yj10rb"]
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel token (used once, not stored)"
        required: false

env:
  VERCEL_ORG_ID: team_RuTb0xbYPkhwEL3QengvoEjF
  VERCEL_PROJECT_ID: prj_6BtwNw1avdqQG1QhYViSMmk3ZrVy
  API: https://api.vercel.com
  SITE: https://str-motives.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure durable store, deploy, verify
        env:
          INPUT_TOKEN: ${{ github.event.inputs.vercel_token }}
          SECRET_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          TOKEN="${INPUT_TOKEN:-$SECRET_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Vercel token available. Add a VERCEL_TOKEN repo secret to deploy. Skipping."
            exit 0
          fi
          echo "::add-mask::$TOKEN"

          AUTH="Authorization: Bearer $TOKEN"
          Q="teamId=$VERCEL_ORG_ID"

          # Mask any blob token that appears in a string, before it is printed.
          maskblob() { printf '%s' "$1" | grep -oE 'vercel_blob_rw_[A-Za-z0-9_-]+' | while read -r t; do echo "::add-mask::$t"; done; }
          getblobtoken() { printf '%s' "$1" | grep -oE 'vercel_blob_rw_[A-Za-z0-9_-]+' | head -n1; }

          # 1) Ensure a durable Vercel Blob store is connected to the project so
          #    BLOB_READ_WRITE_TOKEN is present on it.
          ENVJSON=$(curl -s "$API/v9/projects/$VERCEL_PROJECT_ID/env?$Q" -H "$AUTH")
          HASBLOB=$(echo "$ENVJSON" | jq -r '.envs[]? | select(.key=="BLOB_READ_WRITE_TOKEN") | .key' | head -n1)

          if [ -n "$HASBLOB" ] && [ "$HASBLOB" != "null" ]; then
            echo "Blob store already configured."
          else
            echo "Creating a Vercel Blob store..."
            RAW=$(curl -s -w $'\n%{http_code}' -X POST "$API/v1/storage/stores/blob?$Q" \
              -H "$AUTH" -H "Content-Type: application/json" -d '{"name":"str-motives-state"}')
            CODE=$(printf '%s' "$RAW" | tail -n1); BODY=$(printf '%s' "$RAW" | sed '$d')
            maskblob "$BODY"
            echo "  store create http $CODE"
            echo "  store body: $BODY"
            STORE_ID=$(printf '%s' "$BODY" | jq -r '[.. | objects | .id? // empty] | map(select(startswith("store_"))) | .[0] // (.store.id? // .id? // empty)' 2>/dev/null)
            [ -z "$STORE_ID" ] && STORE_ID=$(printf '%s' "$BODY" | grep -oE 'store_[A-Za-z0-9]+' | head -n1)
            echo "  store id: $STORE_ID"

            BLOB_TOKEN=$(getblobtoken "$BODY")

            # If the create response didn't include a token, connect the store to
            # the project — that generates BLOB_READ_WRITE_TOKEN on the project.
            if [ -z "$BLOB_TOKEN" ] && [ -n "$STORE_ID" ]; then
              CRAW=$(curl -s -w $'\n%{http_code}' -X POST "$API/v1/storage/stores/$STORE_ID/connections?$Q" \
                -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"environments\":[\"production\",\"preview\",\"development\"]}")
              CCODE=$(printf '%s' "$CRAW" | tail -n1); CBODY=$(printf '%s' "$CRAW" | sed '$d')
              maskblob "$CBODY"
              echo "  connect http $CCODE"
              echo "  connect body: $CBODY"
              BLOB_TOKEN=$(getblobtoken "$CBODY")
            fi

            if [ -n "$BLOB_TOKEN" ]; then
              echo "::add-mask::$BLOB_TOKEN"
              curl -s -X POST "$API/v10/projects/$VERCEL_PROJECT_ID/env?$Q&upsert=true" -H "$AUTH" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"BLOB_READ_WRITE_TOKEN\",\"value\":\"$BLOB_TOKEN\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}" \
                -o /dev/null -w "  set BLOB_READ_WRITE_TOKEN -> http %{http_code}\n"
              echo "Blob store provisioned."
            else
              # Re-check: connecting may have created the env var directly.
              RECHK=$(curl -s "$API/v9/projects/$VERCEL_PROJECT_ID/env?$Q" -H "$AUTH" | jq -r '.envs[]? | select(.key=="BLOB_READ_WRITE_TOKEN") | .key' | head -n1)
              if [ -n "$RECHK" ] && [ "$RECHK" != "null" ]; then
                echo "Blob token created on project by the connection."
              else
                echo "  Could not obtain a blob token (see bodies above). Continuing; app will report via /api/health."
              fi
            fi
          fi

          # 2) Deploy (the deployment inherits BLOB_READ_WRITE_TOKEN).
          npm i -g vercel@latest
          vercel deploy --prod --yes --token="$TOKEN"

          # 3) Verify durability via the health endpoint (independent read + write
          #    against the durable Blob store).
          echo "Verifying persistence..."
          sleep 20
          HEALTH=$(curl -s "$SITE/api/health")
          echo "  health: $HEALTH"
          if echo "$HEALTH" | grep -q '"readable":true' && echo "$HEALTH" | grep -q '"writable":true'; then
            echo "  PERSISTENCE OK — durable Blob store is readable and writable."
          else
            echo "  WARNING: durable store is not fully working."
          fi
